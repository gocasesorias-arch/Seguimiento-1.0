<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seguimiento de Capacitaciones</title>

  <!-- React + Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { background:#f8fafc; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="bg-slate-900 text-white shadow">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <h1 class="text-xl font-semibold tracking-wide">Sistema de Seguimiento de Capacitaciones</h1>
      <span class="text-sm text-slate-300">Versión ejecutiva</span>
    </div>
  </header>

  <!-- CONTENEDOR APP -->
  <main class="max-w-7xl mx-auto px-6 py-6">
    <div id="root"></div>
  </main>

  <!-- 🔗 MANTIENE EL ORIGEN DE DATOS DEL INDEX -->
  <script src="cursos_data_inline.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const App = () => {
      const [data, setData] = useState([]);
      const [filtros, setFiltros] = useState({
        vp: 'Todos',
        gerencia: 'Todas',
        tipo: 'Todos',
        año: 'Todos',
        responsable: 'Todos'
      });

      const [opciones, setOpciones] = useState({ vp: [], gerencia: [], tipo: [], año: [], responsable: [] });

      useEffect(() => {
        if (window.cursosData && window.cursosData.length > 1) {
          const registros = window.cursosData.slice(1);
          setData(registros);

          setOpciones({
            vp: ['Todos', ...new Set(registros.map(r => r['VP']).filter(Boolean))],
            gerencia: ['Todas', ...new Set(registros.map(r => r['Gerencia']).filter(Boolean))],
            tipo: ['Todos', ...new Set(registros.map(r => r['Tipo de Plan']).filter(Boolean))],
            año: ['Todos', ...new Set(registros.map(r => String(r['Año'])).filter(Boolean))],
            responsable: ['Todos', ...new Set(registros.map(r => r['PDC Responsable OTIC']).filter(Boolean))]
          });
        }
      }, []);

      const aplicarFiltros = (r) => (
        (filtros.vp === 'Todos' || r['VP'] === filtros.vp) &&
        (filtros.gerencia === 'Todas' || r['Gerencia'] === filtros.gerencia) &&
        (filtros.tipo === 'Todos' || r['Tipo de Plan'] === filtros.tipo) &&
        (filtros.año === 'Todos' || String(r['Año']) === filtros.año) &&
        (filtros.responsable === 'Todos' || r['PDC Responsable OTIC'] === filtros.responsable)
      );

      const datosFiltrados = data.filter(aplicarFiltros);

      return (
        <div className="space-y-6">

          {/* PANEL FILTROS EN CASCADA (HEREDADO DE seguimiento_capacitaciones) */}
          <div className="bg-white rounded-xl shadow p-6">
            <h2 className="text-lg font-semibold mb-4">Filtros</h2>
            <div className="grid grid-cols-1 md:grid-cols-5 gap-4">
              {['vp','gerencia','tipo','año','responsable'].map(k => (
                <select key={k}
                  className="border rounded-lg px-3 py-2"
                  value={filtros[k]}
                  onChange={e => setFiltros({...filtros,[k]:e.target.value})}
                >
                  {opciones[k]?.map(o => <option key={o}>{o}</option>)}
                </select>
              ))}
            </div>
          </div>

          {/* TABLA PRINCIPAL */}
          <div className="bg-white rounded-xl shadow overflow-x-auto">
            <table className="min-w-full text-sm">
              <thead className="bg-slate-100 text-slate-700">
                <tr>
                  <th className="px-4 py-3 text-left">Curso</th>
                  <th className="px-4 py-3">VP</th>
                  <th className="px-4 py-3">Gerencia</th>
                  <th className="px-4 py-3">Estado</th>
                  <th className="px-4 py-3">Responsable</th>
                  <th className="px-4 py-3">Año</th>
                </tr>
              </thead>
              <tbody>
                {datosFiltrados.map((r,i) => (
                  <tr key={i} className="border-t hover:bg-slate-50">
                    <td className="px-4 py-2 font-medium">{r['Nombre Curso']}</td>
                    <td className="px-4 py-2">{r['VP']}</td>
                    <td className="px-4 py-2">{r['Gerencia']}</td>
                    <td className="px-4 py-2">
                      <span className="px-2 py-1 rounded text-xs bg-blue-100 text-blue-700">
                        {r['Estado Actividad']}
                      </span>
                    </td>
                    <td className="px-4 py-2">{r['PDC Responsable OTIC']}</td>
                    <td className="px-4 py-2 text-center">{r['Año']}</td>
                  </tr>
                ))}
              </tbody>
            </table>

            {datosFiltrados.length === 0 && (
              <div className="p-6 text-center text-slate-500">Sin resultados con los filtros aplicados</div>
            )}
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
